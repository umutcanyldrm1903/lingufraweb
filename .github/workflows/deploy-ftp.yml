name: Deploy Web To Hosting (FTP)

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/**'
      - 'lang/**'
      - 'Modules/**'
      - 'public/**'
      - 'resources/**'
      - 'routes/**'
      - 'storage/**'
      - 'tests/**'
      - '.env.example'
      - '.gitignore'
      - '.htaccess'
      - 'artisan'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'vite-module-loader.js'
      - 'server.php'
      - 'tailwind.config.js'
      - 'version.json'
      - '.github/workflows/deploy-ftp.yml'
  workflow_dispatch:

concurrency:
  group: ftp-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || 21 }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR || '/' }}
        run: |
          ssl_setting="off"
          if [ "$FTP_PROTOCOL" = "ftps" ]; then
            ssl_setting="on"
          fi

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" -e "
            set cmd:fail-exit yes;
            set ftp:ssl-allow $ssl_setting;
            set ssl:verify-certificate no;
            set net:max-retries 2;
            set net:timeout 20;
            set xfer:clobber on;
            set ftp:passive-mode true;
            open -p $FTP_PORT $FTP_SERVER;
            mirror -R . $FTP_TARGET_DIR \
              --verbose \
              --only-newer \
              --parallel=2 \
              --exclude-glob .git* \
              --exclude-glob .github \
              --exclude-glob node_modules \
              --exclude-glob vendor \
              --exclude-glob .env \
              --exclude-glob .env.* \
              --exclude-glob storage \
              --exclude-glob bootstrap/cache \
              --exclude-glob mobile \
              --exclude-glob tmp \
              --exclude-glob output \
              --exclude-glob *.zip \
              --exclude-glob public/uploads;
            bye
          "
